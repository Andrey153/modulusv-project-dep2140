  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc">
  <title>modulusV icon (v-only version)</title>
  <desc>Dark rounded square with a single, sharp V in bright accent colour.</desc>

  <!-- Background tile -->
